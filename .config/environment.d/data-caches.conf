# Regenerable build and package caches live on the /data NVMe so they can't fill /home.
# Read by systemd --user here and sourced by ~/.zshenv; keep values literal (no ${...}).
GOCACHE=/data/cache/go-build
GOMODCACHE=/data/cache/go-mod
UV_CACHE_DIR=/data/cache/uv
GRADLE_USER_HOME=/data/cache/gradle
npm_config_cache=/data/cache/npm
PIP_CACHE_DIR=/data/cache/pip
PLAYWRIGHT_BROWSERS_PATH=/data/cache/ms-playwright
