onboarding = false
# Mirrors the Omarchy tmux config in config/tmux/tmux.conf
# tmux session -> herdr workspace, tmux window -> herdr tab, tmux pane -> herdr pane

[session]
resume_agents_on_restore = true

[theme]
# tmux ran on the terminal's own palette (bg=default, fg=default, ANSI blue accents)
name = "catppuccin"
auto_switch = false
[terminal]
# Matches -c "#{pane_current_path}" on every split, window, and session
new_cwd = "follow"

[keys]
prefix = "ctrl+space"

# Config and help
reload_config = "prefix+q"
help = "prefix+?"
detach = "prefix+d"

# Copy mode
copy_mode = "prefix+["

# Panes
split_horizontal = ["prefix+h", "alt+enter"]
split_vertical = ["prefix+v", "alt+shift+enter"]
close_pane = ["prefix+x", "alt+esc"]
zoom = "prefix+z"
last_pane = "prefix+;"

focus_pane_left = "ctrl+alt+left"
focus_pane_down = "ctrl+alt+down"
focus_pane_up = "ctrl+alt+up"
focus_pane_right = "ctrl+alt+right"

resize_mode = ["prefix+ctrl+left", "prefix+ctrl+down", "prefix+ctrl+up", "prefix+ctrl+right"]

# Like resize-pane on C-M-S-arrows
resize_pane_left = "ctrl+alt+shift+left"
resize_pane_down = "ctrl+alt+shift+down"
resize_pane_up = "ctrl+alt+shift+up"
resize_pane_right = "ctrl+alt+shift+right"

# No tmux equivalent; herdr's default prefix+shift+p is taken by previous session
rename_pane = "prefix+shift+o"

# Windows -> tabs
new_tab = "prefix+c"
rename_tab = "prefix+r"
close_tab = "prefix+k"
switch_tab = ["alt+1..9"]
previous_tab = ["alt+left"]
next_tab = ["alt+right"]

# Like swap-window -t -1/+1 on M-S-Left/Right
move_tab_previous = "alt+shift+left"
move_tab_next = "alt+shift+right"

# Sessions -> workspaces
new_workspace = "prefix+shift+c"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+k"
previous_workspace = ["prefix+shift+p", "alt+up"]
next_workspace = ["prefix+shift+n", "alt+down"]

# Agents
previous_agent = "prefix+p"
next_agent = "prefix+n"
focus_agent = "prefix+1..9"

[ui]

# >>> herdr-radar tab-bar block
tab_bar_right_separator = " · "
tab_bar_right = [
  { type = 'command', command = 'cat "/home/tj/.local/state/herdr/plugins/hhdebb.herdr-radar/tabbar.txt"', interval_seconds = 6, timeout_seconds = 2 },
]
# <<< herdr-radar tab-bar block

accent = "blue"

# tmux drew single-line dividers between adjacent panes and no outer frame
pane_gaps = false
pane_outer_borders = false

# tmux had no scrollbar column beside its panes
pane_scrollbars = false

# kill-window and kill-session never asked
confirm_close = true

# automatic-rename gave windows a name without prompting
prompt_new_tab_name = false

# Let Herdr capture mouse input for pane interaction and scrolling.
mouse_capture = true

# set -g set-titles on / set -g set-titles-string '#h:#W', where tmux's #W was
# the basename of the pane cwd. This is what Hyprland shows in the group bar,
# and it resolves on the server so remote sessions name the remote host.
window_title = "{hostname}: {workspace}"

agent_panel_sort = "priority"
[ui.toast]
delivery = "system"

[ui.sidebar]

[worktrees]
directory = "~/worktrees"

[[keys.command]]
key = "prefix+a"
type = "shell"
command = "\"$HERDR_BIN_PATH\" pane run \"$HERDR_ACTIVE_PANE_ID\" codex"
description = "Launch Codex"

[[keys.command]]
key = "prefix+shift+a"
type = "shell"
command = "\"$HERDR_BIN_PATH\" pane run \"$HERDR_ACTIVE_PANE_ID\" claude"
description = "Launch Claude"

[[keys.command]]
key = "prefix+shift+b"
type = "plugin_action"
command = "herdr-beads.open-dock"
description = "Toggle beads dock (bd issues, docked left)"

[[keys.command]]
key = "prefix+shift+v"
type = "plugin_action"
command = "herdr-beads.open-board"
description = "Open beads board (floating kanban, q to close)"

# Was prefix+shift+r, which the builtin keys.rename_workspace shadowed -- herdr
# kept rename_workspace and silently disabled this one.
[[keys.command]]
key = "prefix+shift+f"
type = "plugin_action"
command = "herdr-agent-quota.refresh"
description = "refresh all agent quotas"

[[keys.command]]
key = "prefix+shift+q"
type = "plugin_action"
command = "herdr-agent-quota.open-settings"
description = "open agent quota settings"

[[keys.command]]
key = "prefix+g"
type = "shell"
command = "/home/tj/.local/bin/herdr-bead-focus"
description = "Bead on clipboard -> focus its agent, else worktree + Codex (y in the beads board)"

[[keys.command]]
key = "prefix+shift+g"
type = "shell"
command = "/home/tj/.local/bin/herdr-bead-focus claude"
description = "Bead on clipboard -> focus its agent, else worktree + Claude"

# >>> herdr-radar theme block
[theme.custom]
active_row_bg = "#414868"
# <<< herdr-radar theme block

